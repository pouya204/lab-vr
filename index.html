<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>شبیه‌ساز آزمایشگاه | پویا الهامی</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #canvas-container.grabbing {
      cursor: grabbing !important;
    }
    .hud {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 300px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .hud h1 {
      margin: 0 0 4px 0;
      font-size: 14px;
      color: #38bdf8;
    }
    .hud .author {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin: 5px 0;
    }
    .value {
      color: #facc15;
      font-weight: bold;
      direction: ltr;
    }
    .progress {
      width: 100%;
      height: 7px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #f59e0b, #ef4444);
      transition: width 0.1s linear;
    }
    .guide {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid #38bdf8;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }
    .help-box {
      position: absolute;
      bottom: 16px;
      left: 16px;
      color: #94a3b8;
      font-size: 11px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 12px;
      line-height: 1.5;
      pointer-events: none;
    }
    .reset-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      padding: 10px 16px;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }
    .reset-btn:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #ffffff;
      border-color: #ef4444;
      transform: translateY(-2px);
    }
    #vr-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #38bdf8;
      border-radius: 30px;
      padding: 12px 28px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.5);
      display: none;
    }
    #vr-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud" id="html-hud">
    <h1>شبیه‌ساز آزمایشگاه</h1>
    <div class="author">پویا الهامی</div>

    <div class="row">
      <span>وضعیت بشر:</span>
      <span id="beaker-state" class="value">خالی</span>
    </div>
    <div class="row">
      <span>شعله:</span>
      <span id="burner-state" class="value">خاموش</span>
    </div>
    <div class="row">
      <span>دماسنج:</span>
      <span id="thermo-state" class="value">خارج از بشر</span>
    </div>
    <div class="row">
      <span>دمای آب:</span>
      <span id="temp-state" class="value">25.0 °C</span>
    </div>
    <div class="progress">
      <div id="heat-progress" class="progress-fill"></div>
    </div>
  </div>

  <div id="guide-tip" class="guide">لیوان آب را بردارید و بالای بشر خالی کنید.</div>

  <div class="help-box" id="html-help">
    <b>دسکتاپ:</b> درگ موس برای وسایل | کلیک راست چرخش<br/>
    <b>در Quest:</b> نزدیک‌کردن انگشت شست و اشاره (Pinch) جهت گرفتن مستقیم اشیا
  </div>

  <button class="reset-btn" id="desktop-reset-btn">بازنشانی محیط (Reset)</button>
  <button id="vr-btn">ورود به واقعیت مجازی (Meta Quest)</button>

  <!-- بارگذاری پایدار و مستقل Three.js بدون نیاز به اسکریپت ماژولار خارجی -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let labStage;
    let cupGroup, cupWater;
    let beakerGroup, beakerWater;
    let thermometerGroup, lcdCanvas, lcdCtx, lcdTexture;
    let matchGroup, matchFlame, matchLight, matchbox;
    let burnerGroup, burnerFlameInner, burnerFlameOuter, burnerLight;
    let vrResetCapMesh;

    let vrHudMesh, vrHudCanvas, vrHudCtx, vrHudTexture;

    let activeDrag = null;
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const planeHit = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    const hitTargets = [];

    // کنترلرها و مدل دست‌های سه‌بعدی
    let controller1, controller2;
    let hand1, hand2;
    let handMeshes = { left: null, right: null };
    let controllerLines = [];
    let xrGrabbed = null;
    const xrRaycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();

    // موقعیت‌های پیش‌فرض محلی
    const POS_CUP_DEF = new THREE.Vector3(0.55, 0.265, 0.15);
    const POS_THERMO_DEF = new THREE.Vector3(0.45, 0.12, 0.35);
    const POS_MATCH_DEF = new THREE.Vector3(-0.5, 0.055, 0.25);

    const OBJECT_TABLE_OFFSETS = {
      cup: 0.225,
      thermometer: 0.08,
      match: 0.02
    };

    const simState = {
      beakerFilled: false,
      burnerLit: false,
      matchLit: false,
      thermoActive: false,
      waterTemp: 25.0,
      displayTemp: 25.0,
      heatStartTime: null,
      heatDuration: 120.0,
      guideText: 'لیوان آب را بردارید و بالای بشر خالی کنید.'
    };

    const particles = {
      steam: [],
      bubbles: [],
      sparks: []
    };

    const $ = (id) => document.getElementById(id);
    const updateTip = (msg) => { 
      simState.guideText = msg;
      $('guide-tip').innerText = msg; 
      updateVRHUD();
    };
    const updateStatus = (id, msg, color = '#facc15') => {
      const el = $(id);
      if (el) {
        el.innerText = msg;
        el.style.color = color;
      }
      updateVRHUD();
    };

    function resetEnvironment() {
      if (xrGrabbed) {
        labStage.attach(xrGrabbed.object);
        xrGrabbed = null;
      }
      if (activeDrag) {
        controls.enabled = true;
        $('canvas-container').classList.remove('grabbing');
        activeDrag = null;
      }

      ['sparks', 'bubbles', 'steam'].forEach((key) => {
        particles[key].forEach((p) => scene.remove(p));
        particles[key] = [];
      });

      simState.beakerFilled = false;
      simState.burnerLit = false;
      simState.matchLit = false;
      simState.thermoActive = false;
      simState.waterTemp = 25.0;
      simState.displayTemp = 25.0;
      simState.heatStartTime = null;
      simState.guideText = 'لیوان آب را بردارید و بالای بشر خالی کنید.';

      if (cupGroup.parent !== labStage) labStage.attach(cupGroup);
      cupGroup.position.copy(POS_CUP_DEF);
      cupGroup.rotation.set(0, 0, 0);
      cupWater.scale.set(1, 1, 1);
      cupWater.position.set(0, 0.02, 0);

      beakerWater.visible = false;
      beakerWater.scale.set(1, 1, 1);
      beakerWater.position.set(0, -0.27, 0);

      if (matchGroup.parent !== labStage) labStage.attach(matchGroup);
      matchGroup.position.copy(POS_MATCH_DEF);
      matchGroup.rotation.set(0, 0, 0);
      matchFlame.visible = false;
      matchFlame.scale.set(1, 1, 1);
      matchLight.intensity = 0;

      burnerGroup.flame.visible = false;
      burnerFlameInner.scale.set(1, 1, 1);
      burnerFlameOuter.scale.set(1, 1, 1);
      burnerLight.intensity = 0;

      if (thermometerGroup.parent !== labStage) labStage.attach(thermometerGroup);
      thermometerGroup.position.copy(POS_THERMO_DEF);
      thermometerGroup.rotation.set(0, 0, Math.PI / 2);

      $('heat-progress').style.width = '0%';
      $('temp-state').innerText = '25.0 °C';
      updateStatus('beaker-state', 'خالی', '#facc15');
      updateStatus('burner-state', 'خاموش', '#facc15');
      updateStatus('thermo-state', 'خارج از بشر', '#facc15');
      updateTip(simState.guideText);
      drawDisplay(25.0);
      updateVRHUD();
    }

    function triggerResetButtonVisual() {
      if (!vrResetCapMesh) return;
      vrResetCapMesh.position.y = 0.015;
      setTimeout(() => {
        if (vrResetCapMesh) vrResetCapMesh.position.y = 0.03;
      }, 180);
    }

    function clampAboveTable(object, isXR = false) {
      if (!object || !object.userData || !object.userData.type) return;

      const offset = OBJECT_TABLE_OFFSETS[object.userData.type] || 0.05;
      const TABLE_TOP_Y = 0.04;
      const minLocalY = TABLE_TOP_Y + offset;

      if (!isXR) {
        if (object.position.y < minLocalY) {
          object.position.y = minLocalY;
        }
      } else {
        const worldPos = new THREE.Vector3();
        object.getWorldPosition(worldPos);

        const localPos = labStage.worldToLocal(worldPos.clone());
        if (localPos.y < minLocalY) {
          localPos.y = minLocalY;
          const clampedWorldPos = labStage.localToWorld(localPos);
          if (object.parent) {
            object.parent.worldToLocal(clampedWorldPos);
            object.position.copy(clampedWorldPos);
          }
        }
      }
    }

    function init() {
      const container = $('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f1d);

      labStage = new THREE.Group();
      labStage.position.set(0, 0.75, -1.35);
      scene.add(labStage);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 50);
      camera.position.set(0, 1.5, 0.7);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local-floor');

      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 1.25, -1.35);
      controls.mouseButtons = {
        LEFT: null,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.ROTATE
      };

      initLighting();
      initEnvironment();
      initBeaker();
      initCup();
      initThermometer();
      initMatchbox();
      initBurner();
      initVRHUD();
      initVRResetButton();

      setupXRControllersAndHands();
      checkXRSupport();

      $('desktop-reset-btn').addEventListener('click', resetEnvironment);

      const dom = renderer.domElement;
      dom.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
      window.addEventListener('resize', onResize);

      renderer.setAnimationLoop(renderLoop);
    }

    function initLighting() {
      scene.add(new THREE.AmbientLight(0xffffff, 0.95));
      const light = new THREE.DirectionalLight(0xffffff, 1.3);
      light.position.set(2, 6, 2);
      light.castShadow = true;
      scene.add(light);
    }

    function initEnvironment() {
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 12),
        new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      floor.receiveShadow = true;
      scene.add(floor);

      const table = new THREE.Mesh(
        new THREE.BoxGeometry(2.2, 0.08, 1.3),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 })
      );
      table.position.y = 0.0;
      table.receiveShadow = true;
      labStage.add(table);

      const legGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.75, 16);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8 });
      [[-0.95, -0.55], [0.95, -0.55], [-0.95, 0.55], [0.95, 0.55]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(x, -0.375, z);
        labStage.add(leg);
      });
    }

    function initVRResetButton() {
      const btnGroup = new THREE.Group();
      btnGroup.position.set(0.88, 0.04, 0.45);

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.03, 0.18),
        new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6 })
      );
      base.position.y = 0.015;
      btnGroup.add(base);

      vrResetCapMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.065, 0.065, 0.03, 24),
        new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, emissive: 0x7f1d1d })
      );
      vrResetCapMesh.position.y = 0.03;
      btnGroup.add(vrResetCapMesh);

      const labelCanvas = document.createElement('canvas');
      labelCanvas.width = 128;
      labelCanvas.height = 64;
      const lCtx = labelCanvas.getContext('2d');
      lCtx.fillStyle = '#0f172a';
      lCtx.fillRect(0, 0, 128, 64);
      lCtx.fillStyle = '#ef4444';
      lCtx.font = 'bold 22px sans-serif';
      lCtx.textAlign = 'center';
      lCtx.textBaseline = 'middle';
      lCtx.fillText('بازنشانی', 64, 32);

      const labelTex = new THREE.CanvasTexture(labelCanvas);
      const labelMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(0.14, 0.07),
        new THREE.MeshBasicMaterial({ map: labelTex })
      );
      labelMesh.rotation.x = -Math.PI / 2;
      labelMesh.position.set(0, 0.031, -0.11);
      btnGroup.add(labelMesh);

      const hitMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.08, 0.2),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hitMesh.position.y = 0.04;
      hitMesh.userData = { isResetButton: true };
      btnGroup.add(hitMesh);
      hitTargets.push(hitMesh);

      labStage.add(btnGroup);
    }

    function createHitbox(group, size) {
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      box.userData = {
        parentGroup: group,
        isXRHitbox: true
      };
      group.add(box);
      hitTargets.push(box);
    }

    // طراحی بشر با خطوط مدرج کامپکت و دیده شدن تضمینی
    function initBeaker() {
      beakerGroup = new THREE.Group();
      beakerGroup.position.set(0, 0.58, 0);

      // شیشه کریستالی با رنگ آبی آسمانی ملایم
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0xbae6fd,
        transparent: true,
        opacity: 0.45,
        roughness: 0.1,
        metalness: 0.15,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const cylGeo = new THREE.CylinderGeometry(0.32, 0.30, 0.65, 36, 1, true);
      const cyl = new THREE.Mesh(cylGeo, glassMat);
      beakerGroup.add(cyl);

      const btm = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.02, 36), glassMat);
      btm.position.y = -0.32;
      beakerGroup.add(btm);

      // حاشیه و خطوط کناری برای تفکیک کامل لبه شیشه
      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.318, 0.014, 12, 40),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, metalness: 0.3 })
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 0.325;
      beakerGroup.add(rim);

      // خطوط درجه‌بندی مدرج
      const markMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85, depthWrite: false });
      [-0.18, -0.08, 0.02, 0.12, 0.22].forEach((yPos) => {
        const mark = new THREE.Mesh(new THREE.TorusGeometry(0.31, 0.004, 6, 36), markMat);
        mark.rotation.x = Math.PI / 2;
        mark.position.y = yPos;
        beakerGroup.add(mark);
      });

      // آب داخل بشر
      beakerWater = new THREE.Mesh(
        new THREE.CylinderGeometry(0.285, 0.285, 0.05, 32),
        new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.85, roughness: 0.1, depthWrite: false })
      );
      beakerWater.position.y = -0.27;
      beakerWater.visible = false;
      beakerGroup.add(beakerWater);

      labStage.add(beakerGroup);
    }

    function initCup() {
      cupGroup = new THREE.Group();
      cupGroup.position.copy(POS_CUP_DEF);
      cupGroup.userData = { type: 'cup', defaultPos: POS_CUP_DEF.clone() };

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.2, 0.45, 28),
        new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.3 })
      );
      body.castShadow = true;
      cupGroup.add(body);

      cupWater = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.18, 0.35, 28),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 })
      );
      cupWater.position.y = 0.02;
      cupGroup.add(cupWater);

      createHitbox(cupGroup, new THREE.Vector3(0.5, 0.6, 0.5));
      labStage.add(cupGroup);
    }

    function initThermometer() {
      thermometerGroup = new THREE.Group();
      thermometerGroup.position.copy(POS_THERMO_DEF);
      thermometerGroup.rotation.z = Math.PI / 2;
      thermometerGroup.userData = { type: 'thermometer', defaultPos: POS_THERMO_DEF.clone() };

      const probe = new THREE.Mesh(
        new THREE.CylinderGeometry(0.015, 0.015, 0.65, 16),
        new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.8, roughness: 0.2 })
      );
      probe.position.y = -0.32;
      thermometerGroup.add(probe);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.22, 0.08),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 })
      );
      body.position.y = 0.08;
      thermometerGroup.add(body);

      lcdCanvas = document.createElement('canvas');
      lcdCanvas.width = 256;
      lcdCanvas.height = 128;
      lcdCtx = lcdCanvas.getContext('2d');
      lcdTexture = new THREE.CanvasTexture(lcdCanvas);

      const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(0.11, 0.06),
        new THREE.MeshBasicMaterial({ map: lcdTexture })
      );
      screen.position.set(0, 0.09, 0.041);
      thermometerGroup.add(screen);

      drawDisplay(simState.displayTemp);
      createHitbox(thermometerGroup, new THREE.Vector3(0.4, 0.8, 0.4));
      labStage.add(thermometerGroup);
    }

    function initMatchbox() {
      matchbox = new THREE.Group();
      matchbox.position.set(-0.5, 0.06, 0.05);

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.11, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.8 })
      );
      matchbox.add(base);

      const side = new THREE.Mesh(
        new THREE.BoxGeometry(0.03, 0.08, 0.52),
        new THREE.MeshStandardMaterial({ color: 0x3f1d0b, roughness: 0.95 })
      );
      side.position.x = 0.21;
      matchbox.add(side);
      labStage.add(matchbox);

      matchGroup = new THREE.Group();
      matchGroup.position.copy(POS_MATCH_DEF);
      matchGroup.userData = { type: 'match', defaultPos: POS_MATCH_DEF.clone() };

      const stick = new THREE.Mesh(
        new THREE.BoxGeometry(0.03, 0.03, 0.42),
        new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.7 })
      );
      matchGroup.add(stick);

      const tip = new THREE.Mesh(
        new THREE.SphereGeometry(0.035, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.5 })
      );
      tip.position.z = -0.21;
      matchGroup.add(tip);

      matchFlame = new THREE.Mesh(
        new THREE.ConeGeometry(0.035, 0.12, 16),
        new THREE.MeshBasicMaterial({ color: 0xfb923c, transparent: true, opacity: 0.9 })
      );
      matchFlame.position.set(0, 0.07, -0.21);
      matchFlame.visible = false;
      matchGroup.add(matchFlame);

      matchLight = new THREE.PointLight(0xf97316, 0, 1.5);
      matchLight.position.set(0, 0.07, -0.21);
      matchGroup.add(matchLight);

      lcdCtx.lineWidth = 6;

      lcdCtx.fillStyle = '#34d399';

      lcdCtx.textBaseline = 'middle';
      lcdCtx.fillText(temp.toFixed(1) + '°C', 128, 64);

    function checkXRSupport() {
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            const btn = $('vr-btn');
            btn.style.display = 'block';
            let currentSession = null;

            btn.addEventListener('click', () => {
              if (currentSession === null) {
                navigator.xr.requestSession('immersive-vr', {
                  requiredFeatures: ['local-floor'],
                  optionalFeatures: ['bounded-floor', 'hand-tracking']
                }).then((session) => {
                  currentSession = session;
                  btn.textContent = 'خروج از واقعیت مجازی';
                  renderer.xr.setSession(session);

                  session.addEventListener('end', () => {
                    currentSession = null;
                    if (xrGrabbed) {
                      labStage.attach(xrGrabbed.object);
                      clampAboveTable(xrGrabbed.object, false);
                      resetObjectTransform(xrGrabbed.object);
                      xrGrabbed = null;
                    }
                    activeDrag = null;
                    btn.textContent = 'ورود به واقعیت مجازی (Meta Quest)';
                  });
                }).catch((error) => {
                  console.error('WebXR session error:', error);
                });
              } else {
                currentSession.end();
              }
            });
          }
        });
      }
    }

    // ساخت دست‌های سه‌بعدی بدون نیاز به ماژول خارجی (مستقل و ضد کرش)
    function createProceduralHand() {
      const handGroup = new THREE.Group();
      const jointMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        roughness: 0.3,
        metalness: 0.5,
        emissive: 0x0284c7,
        emissiveIntensity: 0.2
      });

      // ساخت ۲۵ مفصل استاندارد WebXR Hand
      for (let i = 0; i < 25; i++) {
        const jointMesh = new THREE.Mesh(new THREE.SphereGeometry(0.009, 12, 12), jointMat);
        jointMesh.visible = false;
        handGroup.add(jointMesh);
      }
      return handGroup;
    }

    function setupXRControllersAndHands() {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -3.0)
      ]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8 });

      // ۱. کنترلر و دست چپ
      controller1 = renderer.xr.getController(0);
      controller1.addEventListener('selectstart', onXRSelectStart);
      controller1.addEventListener('selectend', onXRSelectEnd);
      controller1.addEventListener('squeezestart', onXRSelectStart);
      controller1.addEventListener('squeezeend', onXRSelectEnd);
      const line1 = new THREE.Line(lineGeo, lineMat);
      controller1.add(line1);
      controllerLines.push(line1);
      scene.add(controller1);

      hand1 = renderer.xr.getHand(0);
      hand1.userData = { handedness: 'left', isPinching: false };
      handMeshes.left = createProceduralHand();
      hand1.add(handMeshes.left);
      hand1.addEventListener('connected', () => {
        line1.visible = false;
      });
      scene.add(hand1);

      // ۲. کنترلر و دست راست
      controller2 = renderer.xr.getController(1);
      controller2.addEventListener('selectstart', onXRSelectStart);
      controller2.addEventListener('selectend', onXRSelectEnd);
      controller2.addEventListener('squeezestart', onXRSelectStart);
      controller2.addEventListener('squeezeend', onXRSelectEnd);
      const line2 = new THREE.Line(lineGeo, lineMat);
      controller2.add(line2);
      controllerLines.push(line2);
      scene.add(controller2);

      hand2 = renderer.xr.getHand(1);
      hand2.userData = { handedness: 'right', isPinching: false };
      handMeshes.right = createProceduralHand();
      hand2.add(handMeshes.right);
      hand2.addEventListener('connected', () => {
        line2.visible = false;
      });
      scene.add(hand2);

    // به‌روزرسانی اسکلت دست و محاسبه دقیق Pinch
    function updateHandTracking(hand, handMeshGroup, frame, refSpace) {
      if (!hand || !frame || !refSpace) return;

      const inputSource = hand.inputSource || (hand.userData && hand.userData.inputSource);
      const handObj = hand.hand || (inputSource && inputSource.hand);

      let indexTipPos = null;
      let thumbTipPos = null;

      if (handObj) {
        let i = 0;
        for (const [jointName, jointSpace] of handObj.entries()) {
          const pose = frame.getJointPose ? frame.getJointPose(jointSpace, refSpace) : null;
          const jointMesh = handMeshGroup.children[i];

          if (pose && jointMesh) {
            jointMesh.visible = true;
            jointMesh.position.copy(pose.transform.position);
            jointMesh.quaternion.copy(pose.transform.orientation);

            if (jointName === 'index-finger-tip') {
              indexTipPos = new THREE.Vector3().copy(pose.transform.position);
            }
            if (jointName === 'thumb-tip') {
              thumbTipPos = new THREE.Vector3().copy(pose.transform.position);
            }
          } else if (jointMesh) {
            jointMesh.visible = false;
          }
          i++;
        }
      }

      // بررسی Pinch بر اساس فاصله نوک انگشت شست و اشاره
      if (indexTipPos && thumbTipPos) {
        const pinchDist = indexTipPos.distanceTo(thumbTipPos);
        const pinchCenter = indexTipPos.clone().lerp(thumbTipPos, 0.5);
        const isPinch = pinchDist < 0.038;

        if (isPinch && !hand.userData.isPinching) {
          hand.userData.isPinching = true;

          if (!xrGrabbed) {
            const resetPos = new THREE.Vector3();
            vrResetCapMesh.getWorldPosition(resetPos);
            if (pinchCenter.distanceTo(resetPos) < 0.15) {
              triggerResetButtonVisual();
              resetEnvironment();
              return;
            }

            let closestObj = null;
            let minDistance = 0.22;

            [cupGroup, thermometerGroup, matchGroup].forEach((obj) => {
              const objPos = new THREE.Vector3();
              obj.getWorldPosition(objPos);
              const dist = pinchCenter.distanceTo(objPos);
              if (dist < minDistance) {
                minDistance = dist;
                closestObj = obj;
              }
            });

            if (closestObj) {
              xrGrabbed = {
                object: closestObj,
                controller: hand,
                isHand: true
              };
              activeDrag = closestObj;

              if (closestObj.userData.type === 'thermometer') {
                closestObj.rotation.set(0, 0, 0);
              }

              hand.attach(closestObj);
            }
          }
        } else if (!isPinch && hand.userData.isPinching) {
          hand.userData.isPinching = false;
          if (xrGrabbed && xrGrabbed.controller === hand) {
            releaseXRObject(hand);
          }
        }
      }
    }

    function getXRIntersections(controller) {
      if (!controller) return [];

      controller.updateMatrixWorld(true);
      tempMatrix.identity().extractRotation(controller.matrixWorld);

      xrRaycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      xrRaycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix).normalize();
      xrRaycaster.near = 0.01;
      xrRaycaster.far = 4.0;

      return xrRaycaster.intersectObjects(hitTargets, true);
    }

    function getXRGrabRoot(hit) {
      if (!hit || !hit.object) return null;
      let obj = hit.object;
      while (obj && !obj.userData.parentGroup && obj.parent && obj.parent !== labStage && obj !== scene) {
        obj = obj.parent;
      }
      return obj.userData.parentGroup || obj;
    }

    function grabXRObject(controller) {
      if (!controller || xrGrabbed) return false;

      const hits = getXRIntersections(controller);
      if (!hits.length) return false;

      const hitMesh = hits[0].object;

      if (hitMesh.userData && hitMesh.userData.isResetButton) {
        triggerResetButtonVisual();
        resetEnvironment();
        return false;
      }

      const root = getXRGrabRoot(hits[0]);
      if (!root || !root.userData || !['cup', 'match', 'thermometer'].includes(root.userData.type)) {
        return false;
      }

      xrGrabbed = {
        object: root,
        controller: controller,
        isHand: false
      };
      activeDrag = root;

      if (root.userData.type === 'thermometer') {
        root.rotation.set(0, 0, 0);
      }

      controller.attach(root);
      clampAboveTable(root, true);
      return true;
    }

    function resetObjectTransform(obj) {
      if (!obj) return;
      if (obj.userData.type === 'cup') {
        obj.rotation.set(0, 0, 0);
        if (simState.beakerFilled) {
          obj.position.copy(POS_CUP_DEF);
        }
      } else if (obj.userData.type === 'match') {
        obj.rotation.set(0, 0, 0);
      } else if (obj.userData.type === 'thermometer' && !simState.thermoActive) {
        obj.rotation.set(0, 0, Math.PI / 2);
      }
      clampAboveTable(obj, false);
    }

    function releaseXRObject(controller) {
      if (!xrGrabbed || xrGrabbed.controller !== controller) return false;

      const object = xrGrabbed.object;
      labStage.attach(object);

      clampAboveTable(object, false);

      activeDrag = object;
      processInteractions();
      resetObjectTransform(object);

      activeDrag = null;
      xrGrabbed = null;

      return true;
    }

    function onXRSelectStart(e) {
      grabXRObject(e.target);
    }

    function onXRSelectEnd(e) {
      releaseXRObject(e.target);
    }

    function setPointerCoords(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
    }

    function onPointerDown(e) {
      if (renderer.xr.isPresenting) return;
      if (e.button !== undefined && e.button !== 0) return;
      setPointerCoords(e);

      const hits = raycaster.intersectObjects(hitTargets, true);
      if (hits.length > 0) {
        const hitMesh = hits[0].object;

        if (hitMesh.userData && hitMesh.userData.isResetButton) {
          triggerResetButtonVisual();
          resetEnvironment();
          return;
        }

        const root = getXRGrabRoot(hits[0]);
        if (!root || !['cup', 'match', 'thermometer'].includes(root.userData.type)) return;

        activeDrag = root;
        controls.enabled = false;
        $('canvas-container').classList.add('grabbing');

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        
        const worldPos = new THREE.Vector3();
        activeDrag.getWorldPosition(worldPos);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), worldPos);

        if (raycaster.ray.intersectPlane(dragPlane, planeHit)) {
          dragOffset.copy(worldPos).sub(planeHit);
        }

        if (activeDrag.userData.type === 'thermometer') {
          activeDrag.rotation.set(0, 0, 0);
        }
      }
    }

    function onPointerMove(e) {
      if (renderer.xr.isPresenting) return;
      setPointerCoords(e);

      if (activeDrag) {
        if (raycaster.ray.intersectPlane(dragPlane, planeHit)) {
          const newWorldPos = planeHit.clone().add(dragOffset);
          activeDrag.position.copy(labStage.worldToLocal(newWorldPos));
          clampAboveTable(activeDrag, false);
        }
        processInteractions();
      }
    }

    function onPointerUp() {
      if (renderer.xr.isPresenting) return;
      if (!activeDrag) return;

      controls.enabled = true;
      $('canvas-container').classList.remove('grabbing');
      resetObjectTransform(activeDrag);
      activeDrag = null;
    }

    function processInteractions() {
      if (!activeDrag) return;
      const type = activeDrag.userData.type;

      const dragPosWorld = new THREE.Vector3();
      activeDrag.getWorldPosition(dragPosWorld);

      // ۱. خالی کردن آب لیوان در بشر
      if (type === 'cup' && !simState.beakerFilled) {
        const beakerWorld = new THREE.Vector3();
        beakerGroup.getWorldPosition(beakerWorld);
        beakerWorld.y += 0.4;

        const d = dragPosWorld.distanceTo(beakerWorld);
        if (d < 0.65) {
          activeDrag.rotation.z = 1.15;
          beakerWater.visible = true;

          let s = Math.min(5.0, beakerWater.scale.y + 0.1);
          beakerWater.scale.y = s;
          beakerWater.position.y = -0.27 + (s - 1) * 0.03;
          cupWater.scale.y = Math.max(0.05, 1 - (s / 5.0));

          if (s >= 5.0) {
            simState.beakerFilled = true;
            updateStatus('beaker-state', 'پر از آب', '#38bdf8');
            updateTip('کبریت را روی سمباده بکشید تا مشتعل شود.');
          }
        } else {
          activeDrag.rotation.z = 0;
        }
      }

      // ۲. کبریت و چراغ بونزن
      if (type === 'match') {
        const boxWorld = new THREE.Vector3();
        matchbox.getWorldPosition(boxWorld);

        if (!simState.matchLit && dragPosWorld.distanceTo(boxWorld) < 0.4) {
          simState.matchLit = true;
          matchFlame.visible = true;
          matchLight.intensity = 1.6;
          emitSparks(dragPosWorld);
          updateTip('کبریت روشن شد؛ آن را به سر چراغ بونزن نزدیک کنید.');
        }

        if (simState.matchLit && !simState.burnerLit) {
          const burnerHead = new THREE.Vector3();
          burnerGroup.getWorldPosition(burnerHead);
          burnerHead.y += 0.45;

          if (dragPosWorld.distanceTo(burnerHead) < 0.45) {
            igniteBurner();
          }
        }
      }

      // ۳. دماسنج
      if (type === 'thermometer') {
        const beakerCenter = new THREE.Vector3();
        beakerGroup.getWorldPosition(beakerCenter);

        const dx = dragPosWorld.x - beakerCenter.x;
        const dz = dragPosWorld.z - beakerCenter.z;
        const rad = Math.sqrt(dx * dx + dz * dz);
        const tipY = dragPosWorld.y - 0.4;

        if (simState.beakerFilled && rad < 0.4 && tipY < beakerCenter.y + 0.4 && tipY > beakerCenter.y - 0.3) {
          simState.thermoActive = true;
          updateStatus('thermo-state', 'داخل آب بشر', '#38bdf8');
        } else {
          simState.thermoActive = false;
          updateStatus('thermo-state', 'خارج از آب', '#facc15');
        }
      }
    }

    function igniteBurner() {
      simState.burnerLit = true;
      burnerGroup.flame.visible = true;
      burnerLight.intensity = 2.8;
      simState.heatStartTime = performance.now();

      updateStatus('burner-state', 'شعله فعال', '#38bdf8');
      updateTip('دماسنج را داخل بشر قرار دهید تا تغییرات دما ثبت شود.');

      setTimeout(() => {
        matchFlame.visible = false;
        matchLight.intensity = 0;
      }, 500);
    }

    function emitSparks(pos) {
      for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.012, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0xfacc15 })
        );
        p.position.copy(pos);
        p.userData = {
          velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 0.05,
            Math.random() * 0.05,
            (Math.random() - 0.5) * 0.05
          )
        };
        scene.add(p);
        particles.sparks.push(p);
      }
    }

    function emitBubble() {
      if (!simState.beakerFilled || particles.bubbles.length > 25) return;
      const b = new THREE.Mesh(
        new THREE.SphereGeometry(0.015, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 })
      );
      const beakerWorld = new THREE.Vector3();
      beakerGroup.getWorldPosition(beakerWorld);
      b.position.set(
        beakerWorld.x + (Math.random() - 0.5) * 0.3,
        beakerWorld.y - 0.15,
        beakerWorld.z + (Math.random() - 0.5) * 0.3
      );
      scene.add(b);
      particles.bubbles.push(b);
    }

    function emitSteam() {
      if (!simState.beakerFilled || particles.steam.length > 25) return;
      const s = new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 })
      );
      const beakerWorld = new THREE.Vector3();
      beakerGroup.getWorldPosition(beakerWorld);
      s.position.set(
        beakerWorld.x + (Math.random() - 0.5) * 0.2,
        beakerWorld.y + 0.35,
        beakerWorld.z + (Math.random() - 0.5) * 0.2
      );
      scene.add(s);
      particles.steam.push(s);
    }

    function updateSimulation(now) {
      if (simState.burnerLit && simState.heatStartTime) {
        const elapsed = (now - simState.heatStartTime) / 1000;
        const progress = Math.min(elapsed / simState.heatDuration, 1.0);

        simState.waterTemp = 25.0 + (100.0 - 25.0) * progress;
        $('heat-progress').style.width = (progress * 100).toFixed(1) + '%';
        $('temp-state').innerText = simState.waterTemp.toFixed(1) + ' °C';

        if (simState.waterTemp > 50 && Math.random() < 0.08) emitSteam();
        if (simState.waterTemp > 72 && Math.random() < 0.14) emitBubble();
        if (simState.waterTemp >= 100.0) {
          simState.waterTemp = 100.0;
          if (Math.random() < 0.25) emitSteam();
          if (Math.random() < 0.2) emitBubble();
        }
        updateVRHUD();
      }

      const targetTemp = simState.thermoActive ? simState.waterTemp : 25.0;
      simState.displayTemp += (targetTemp - simState.displayTemp) * 0.08;
      drawDisplay(simState.displayTemp);
    }

    function updateParticles() {
      for (let i = particles.sparks.length - 1; i >= 0; i--) {
        const p = particles.sparks[i];
        p.position.add(p.userData.velocity);
        p.userData.velocity.y -= 0.002;
        p.scale.multiplyScalar(0.92);
        if (p.scale.x < 0.05) {
          scene.remove(p);
          particles.sparks.splice(i, 1);
        }
      }

      for (let i = particles.bubbles.length - 1; i >= 0; i--) {
        const b = particles.bubbles[i];
        b.position.y += 0.008;
        if (b.position.y > 1.45) {
          scene.remove(b);
          particles.bubbles.splice(i, 1);
        }
      }

      for (let i = particles.steam.length - 1; i >= 0; i--) {
        const s = particles.steam[i];
        s.position.y += 0.01;
        s.scale.multiplyScalar(1.01);
        s.material.opacity -= 0.003;
        if (s.material.opacity <= 0.01) {
          scene.remove(s);
          particles.steam.splice(i, 1);
        }
      }
    }

    function renderLoop(timestamp, frame) {
      const now = performance.now();
      const t = now * 0.008;

      // ردیابی دست‌ها و مفاصل در فریم VR
      if (renderer.xr.isPresenting && frame) {
        const refSpace = renderer.xr.getReferenceSpace();
        updateHandTracking(hand1, handMeshes.left, frame, refSpace);
        updateHandTracking(hand2, handMeshes.right, frame, refSpace);
      }

      if (simState.burnerLit) {
        burnerFlameInner.scale.y = 1 + Math.sin(t * 3.5) * 0.12;
        burnerFlameOuter.scale.y = 1 + Math.cos(t * 2.8) * 0.15;
        burnerLight.intensity = 2.6 + Math.sin(t * 5.0) * 0.4;
      }

      if (matchFlame.visible) {
        matchFlame.scale.y = 1 + Math.sin(t * 5.0) * 0.15;
      }

      if (xrGrabbed) {
        clampAboveTable(xrGrabbed.object, true);
        processInteractions();
      }

      updateSimulation(now);
      updateParticles();

      if (!renderer.xr.isPresenting) {
        controls.update();
      }

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
