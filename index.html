<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>شبیه‌ساز آزمایشگاه | پویا الهامی</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    #canvas-container.grabbing {
      cursor: grabbing !important;
    }
    .hud {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 300px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .hud h1 {
      margin: 0 0 4px 0;
      font-size: 14px;
      color: #38bdf8;
    }
    .hud .author {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin: 5px 0;
    }
    .value {
      color: #facc15;
      font-weight: bold;
      direction: ltr;
    }
    .progress {
      width: 100%;
      height: 7px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #f59e0b, #ef4444);
    }
    .guide {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      color: #f8fafc;
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid #38bdf8;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }
    .help-box {
      position: absolute;
      bottom: 16px;
      left: 16px;
      color: #94a3b8;
      font-size: 11px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 12px;
      line-height: 1.5;
      pointer-events: none;
    }
    .reset-btn {
      position: absolute;
      bottom: 16px;
      right: 16px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .reset-btn:hover {
      background: rgba(30, 41, 59, 0.95);
    }
    /* دکمه اختصاصی WebXR بدون وابستگی خارجی */
    #vr-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(14, 165, 233, 0.85);
      color: #ffffff;
      border: 1px solid #38bdf8;
      border-radius: 30px;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
      display: none;
    }
    #vr-btn:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud">
    <h1>شبیه‌ساز آزمایشگاه</h1>
    <div class="author">پویا الهامی</div>

    <div class="row">
      <span>وضعیت بشر:</span>
      <span id="beaker-state" class="value">خالی</span>
    </div>
    <div class="row">
      <span>شعله:</span>
      <span id="burner-state" class="value">خاموش</span>
    </div>
    <div class="row">
      <span>دماسنج:</span>
      <span id="thermo-state" class="value">خارج از بشر</span>
    </div>
    <div class="row">
      <span>دمای آب:</span>
      <span id="temp-state" class="value">25.0 °C</span>
    </div>
    <div class="progress">
      <div id="heat-progress" class="progress-fill"></div>
    </div>
  </div>

  <div id="guide-tip" class="guide">لیوان آب را با کلیک چپ بکشید و بالای بشر ببرید.</div>

  <div class="help-box">
    <b>کلیک چپ / لمس:</b> جابجایی وسایل<br/>
    <b>کلیک راست:</b> چرخش زاویه دید<br/>
    <b>روی Quest 3:</b> کلید تریگر برای گرفتن وسایل
  </div>

  <button class="reset-btn" onclick="location.reload()">تنظیم مجدد</button>
  <button id="vr-btn">ورود به واقعیت مجازی (Meta Quest)</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    let scene, camera, renderer, controls;
    let cupGroup, cupWater;
    let beakerGroup, beakerWater;
    let thermometerGroup, lcdCanvas, lcdCtx, lcdTexture;
    let matchGroup, matchFlame, matchLight, matchbox;
    let burnerGroup, burnerFlameInner, burnerFlameOuter, burnerLight;

    let activeDrag = null;
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const dragPlane = new THREE.Plane();
    const planeHit = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();

    const hitTargets = [];

    // متغیرهای WebXR
    let controller1, controller2;
    let xrGrabbed = null;
    const xrRaycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();

    const POS_CUP_DEF = new THREE.Vector3(2.2, 0.55, 0.8);
    const POS_THERMO_DEF = new THREE.Vector3(2.0, 0.25, 1.6);
    const POS_MATCH_DEF = new THREE.Vector3(-2.1, 0.25, 1.2);

    const simState = {
      beakerFilled: false,
      burnerLit: false,
      matchLit: false,
      thermoActive: false,
      waterTemp: 25.0,
      displayTemp: 25.0,
      heatStartTime: null,
      heatDuration: 30.0
    };

    const particles = {
      steam: [],
      bubbles: [],
      sparks: []
    };

    const $ = (id) => document.getElementById(id);
    const updateTip = (msg) => { $('guide-tip').innerText = msg; };
    const updateStatus = (id, msg, color = '#facc15') => {
      const el = $(id);
      if (el) {
        el.innerText = msg;
        el.style.color = color;
      }
    };

    function init() {
      const container = $('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f1d);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 3.2, 5.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.xr.enabled = true; // فعال‌سازی XR برای کوئست
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 1.0, 0);
      controls.mouseButtons = {
        LEFT: null,
        MIDDLE: THREE.MOUSE.DOLLY,
        RIGHT: THREE.MOUSE.ROTATE
      };

      initLighting();
      initEnvironment();
      initBeaker();
      initCup();
      initThermometer();
      initMatchbox();
      initBurner();

      // فعال‌سازی کنترلرهای عینک
      setupXRControllers();
      checkXRSupport();

      const dom = renderer.domElement;
      dom.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('pointercancel', onPointerUp);
      window.addEventListener('resize', onResize);

      // استفاده از setAnimationLoop برای عملکرد همزمان دسکتاپ و Quest
      renderer.setAnimationLoop(renderLoop);
    }

    function initLighting() {
      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const light = new THREE.DirectionalLight(0xffffff, 1.0);
      light.position.set(4, 7, 3);
      light.castShadow = true;
      scene.add(light);
    }

    function initEnvironment() {
      const table = new THREE.Mesh(
        new THREE.BoxGeometry(8, 0.2, 4.5),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 })
      );
      table.position.y = -0.1;
      table.receiveShadow = true;
      scene.add(table);

      const grid = new THREE.GridHelper(10, 20, 0x475569, 0x1e293b);
      grid.position.y = 0.001;
      scene.add(grid);
    }

    function createHitbox(group, size) {
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthWrite: false })
      );
      box.userData = { parentGroup: group };
      group.add(box);
      hitTargets.push(box);
    }

    function initBeaker() {
      beakerGroup = new THREE.Group();
      beakerGroup.position.set(0, 1.25, 0);

      const glassMat = new THREE.MeshStandardMaterial({
        color: 0xe2e8f0,
        transparent: true,
        opacity: 0.35,
        roughness: 0.1,
        metalness: 0.1,
        side: THREE.DoubleSide
      });

      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.35, 32, 1, true), glassMat);
      const btm = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.04, 32), glassMat);
      btm.position.y = -0.655;

      beakerGroup.add(cyl);
      beakerGroup.add(btm);

      beakerWater = new THREE.Mesh(
        new THREE.CylinderGeometry(0.66, 0.66, 0.1, 28),
        new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.75, roughness: 0.2 })
      );
      beakerWater.position.y = -0.62;
      beakerWater.visible = false;
      beakerGroup.add(beakerWater);

      scene.add(beakerGroup);
    }

    function initCup() {
      cupGroup = new THREE.Group();
      cupGroup.position.copy(POS_CUP_DEF);
      cupGroup.userData = { type: 'cup' };

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.4, 0.9, 28),
        new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3 })
      );
      body.castShadow = true;
      cupGroup.add(body);

      cupWater = new THREE.Mesh(
        new THREE.CylinderGeometry(0.32, 0.36, 0.7, 28),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 })
      );
      cupWater.position.y = 0.05;
      cupGroup.add(cupWater);

      createHitbox(cupGroup, new THREE.Vector3(1.2, 1.4, 1.2));
      scene.add(cupGroup);
    }

    function initThermometer() {
      thermometerGroup = new THREE.Group();
      thermometerGroup.position.copy(POS_THERMO_DEF);
      thermometerGroup.rotation.z = Math.PI / 2;
      thermometerGroup.userData = { type: 'thermometer' };

      const probe = new THREE.Mesh(
        new THREE.CylinderGeometry(0.03, 0.03, 1.3, 16),
        new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.8, roughness: 0.2 })
      );
      probe.position.y = -0.65;
      thermometerGroup.add(probe);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.45, 0.16),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 })
      );
      body.position.y = 0.15;
      thermometerGroup.add(body);

      lcdCanvas = document.createElement('canvas');
      lcdCanvas.width = 256;
      lcdCanvas.height = 128;
      lcdCtx = lcdCanvas.getContext('2d');
      lcdTexture = new THREE.CanvasTexture(lcdCanvas);

      const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(0.22, 0.12),
        new THREE.MeshBasicMaterial({ map: lcdTexture })
      );
      screen.position.set(0, 0.18, 0.081);
      thermometerGroup.add(screen);

      drawDisplay(simState.displayTemp);
      createHitbox(thermometerGroup, new THREE.Vector3(0.9, 1.8, 0.9));
      scene.add(thermometerGroup);
    }

    function initMatchbox() {
      matchbox = new THREE.Group();
      matchbox.position.set(-2.1, 0.12, 0.6);

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 0.22, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.8 })
      );
      matchbox.add(base);

      const side = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.16, 1.05),
        new THREE.MeshStandardMaterial({ color: 0x3f1d0b, roughness: 0.95 })
      );
      side.position.x = 0.42;
      matchbox.add(side);
      scene.add(matchbox);

      matchGroup = new THREE.Group();
      matchGroup.position.copy(POS_MATCH_DEF);
      matchGroup.userData = { type: 'match' };

      const stick = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.06, 0.85),
        new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.7 })
      );
      matchGroup.add(stick);

      const tip = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.5 })
      );
      tip.position.z = -0.42;
      matchGroup.add(tip);

      matchFlame = new THREE.Mesh(
        new THREE.ConeGeometry(0.07, 0.25, 16),
        new THREE.MeshBasicMaterial({ color: 0xfb923c, transparent: true, opacity: 0.9 })
      );
      matchFlame.position.set(0, 0.14, -0.42);
      matchFlame.visible = false;
      matchGroup.add(matchFlame);

      matchLight = new THREE.PointLight(0xf97316, 0, 2.5);
      matchLight.position.set(0, 0.15, -0.42);
      matchGroup.add(matchLight);

      createHitbox(matchGroup, new THREE.Vector3(0.8, 0.8, 1.3));
      scene.add(matchGroup);
    }

    function initBurner() {
      burnerGroup = new THREE.Group();
      burnerGroup.position.set(0, 0, 0);

      const metalMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.3 });

      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.76, 0.1, 28), metalMat);
      base.position.y = 0.05;
      burnerGroup.add(base);

      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.75, 20), metalMat);
      pipe.position.y = 0.58;
      burnerGroup.add(pipe);

      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.035, 12, 28), metalMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 1.22;
      burnerGroup.add(ring);

      const meshGrid = new THREE.Mesh(
        new THREE.BoxGeometry(1.15, 0.02, 1.15),
        new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 })
      );
      meshGrid.position.y = 1.24;
      burnerGroup.add(meshGrid);

      const flameNode = new THREE.Group();
      flameNode.position.set(0, 0.95, 0);

      burnerFlameInner = new THREE.Mesh(
        new THREE.ConeGeometry(0.08, 0.32, 16),
        new THREE.MeshBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.95 })
      );
      burnerFlameInner.position.y = 0.16;
      flameNode.add(burnerFlameInner);

      burnerFlameOuter = new THREE.Mesh(
        new THREE.ConeGeometry(0.18, 0.65, 16),
        new THREE.MeshBasicMaterial({ color: 0x2563eb, transparent: true, opacity: 0.45 })
      );
      burnerFlameOuter.position.y = 0.32;
      flameNode.add(burnerFlameOuter);

      burnerLight = new THREE.PointLight(0x38bdf8, 0, 4);
      burnerLight.position.y = 0.3;
      flameNode.add(burnerLight);

      flameNode.visible = false;
      burnerGroup.flame = flameNode;
      burnerGroup.add(flameNode);

      scene.add(burnerGroup);
    }

    function drawDisplay(temp) {
      lcdCtx.fillStyle = '#051510';
      lcdCtx.fillRect(0, 0, 256, 128);
      lcdCtx.strokeStyle = '#10b981';
      lcdCtx.lineWidth = 6;
      lcdCtx.strokeRect(4, 4, 248, 120);
      lcdCtx.fillStyle = '#34d399';
      lcdCtx.font = 'bold 44px monospace';
      lcdCtx.textAlign = 'center';
      lcdCtx.textBaseline = 'middle';
      lcdCtx.fillText(temp.toFixed(1) + '°C', 128, 64);
      lcdTexture.needsUpdate = true;
    }

    // ==========================================
    // راه‌اندازی WebXR اختصاصی عینک کوئست
    // ==========================================
    function checkXRSupport() {
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            const btn = $('vr-btn');
            btn.style.display = 'block';
            let currentSession = null;

            btn.addEventListener('click', () => {
              if (currentSession === null) {
                navigator.xr.requestSession('immersive-vr', {
                  optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
                }).then((session) => {
                  currentSession = session;
                  btn.textContent = 'خروج از واقعیت مجازی';
                  renderer.xr.setSession(session);
                  session.addEventListener('end', () => {
                    currentSession = null;
                    btn.textContent = 'ورود به واقعیت مجازی (Meta Quest)';
                  });
                });
              } else {
                currentSession.end();
              }
            });
          }
        });
      }
    }

    function setupXRControllers() {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -2)]);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8 });

      // دست ۱
      controller1 = renderer.xr.getController(0);
      controller1.addEventListener('selectstart', onXRSelectStart);
      controller1.addEventListener('selectend', onXRSelectEnd);
      controller1.add(new THREE.Line(lineGeo, lineMat));
      scene.add(controller1);

      // دست ۲
      controller2 = renderer.xr.getController(1);
      controller2.addEventListener('selectstart', onXRSelectStart);
      controller2.addEventListener('selectend', onXRSelectEnd);
      controller2.add(new THREE.Line(lineGeo, lineMat));
      scene.add(controller2);
    }

    function getXRIntersections(controller) {
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      xrRaycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      xrRaycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
      return xrRaycaster.intersectObjects(hitTargets, false);
    }

    function onXRSelectStart(e) {
      const controller = e.target;
      const hits = getXRIntersections(controller);
      if (hits.length > 0) {
        const root = hits[0].object.userData.parentGroup;
        if (root) {
          xrGrabbed = { object: root, controller: controller };
          activeDrag = root;
          if (activeDrag.userData.type === 'thermometer') {
            activeDrag.rotation.set(0, 0, 0);
          }
          controller.attach(root);
        }
      }
    }

    function onXRSelectEnd(e) {
      if (xrGrabbed && xrGrabbed.controller === e.target) {
        scene.attach(xrGrabbed.object);
        processInteractions();
        finishDrag(xrGrabbed.object);
        xrGrabbed = null;
        activeDrag = null;
      }
    }

    function finishDrag(obj) {
      const type = obj.userData.type;
      if (type === 'cup') {
        obj.rotation.set(0, 0, 0);
        obj.position.copy(POS_CUP_DEF);
      } else if (type === 'match' && !simState.burnerLit) {
        obj.position.copy(POS_MATCH_DEF);
      } else if (type === 'thermometer' && !simState.thermoActive) {
        obj.position.copy(POS_THERMO_DEF);
        obj.rotation.set(0, 0, Math.PI / 2);
      }
    }

    // تعاملات ماوس / تاچ دسکتاپ
    function setPointerCoords(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
    }

    function onPointerDown(e) {
      if (renderer.xr.isPresenting) return;
      if (e.button !== undefined && e.button !== 0) return;
      setPointerCoords(e);

      const hits = raycaster.intersectObjects(hitTargets, false);
      if (hits.length > 0) {
        const root = hits[0].object.userData.parentGroup;
        if (!root) return;

        activeDrag = root;
        controls.enabled = false;
        $('canvas-container').classList.add('grabbing');

        const camDir = new THREE.Vector3();
        camera.getWorldDirection(camDir);
        dragPlane.setFromNormalAndCoplanarPoint(camDir.negate(), activeDrag.position);

        if (raycaster.ray.intersectPlane(dragPlane, planeHit)) {
          dragOffset.copy(activeDrag.position).sub(planeHit);
        }

        if (activeDrag.userData.type === 'thermometer') {
          activeDrag.rotation.set(0, 0, 0);
        }
      }
    }

    function onPointerMove(e) {
      if (renderer.xr.isPresenting) return;
      setPointerCoords(e);

      if (activeDrag) {
        if (raycaster.ray.intersectPlane(dragPlane, planeHit)) {
          activeDrag.position.copy(planeHit.clone().add(dragOffset));
        }
        processInteractions();
      }
    }

    function onPointerUp() {
      if (renderer.xr.isPresenting) return;
      if (!activeDrag) return;

      controls.enabled = true;
      $('canvas-container').classList.remove('grabbing');
      finishDrag(activeDrag);
      activeDrag = null;
    }

    function processInteractions() {
      if (!activeDrag) return;
      const type = activeDrag.userData.type;

      if (type === 'cup' && !simState.beakerFilled) {
        const d = activeDrag.position.distanceTo(new THREE.Vector3(0, 1.8, 0));
        if (d < 1.5) {
          activeDrag.rotation.z = 1.15;
          beakerWater.visible = true;

          let s = Math.min(6.0, beakerWater.scale.y + 0.06);
          beakerWater.scale.y = s;
          beakerWater.position.y = -0.62 + (s - 1) * 0.06;
          cupWater.scale.y = Math.max(0.1, 1 - (s / 6.0));

          if (s >= 6.0) {
            simState.beakerFilled = true;
            updateStatus('beaker-state', 'پر از آب', '#38bdf8');
            updateTip('کبریت را بردارید و روی سمباده بکشید تا روشن شود.');
            if (!renderer.xr.isPresenting) onPointerUp();
          }
        } else {
          activeDrag.rotation.z = 0;
        }
      }

      if (type === 'match') {
        const strikerPos = new THREE.Vector3(-1.68, 0.12, 0.6);
        const distStriker = activeDrag.position.distanceTo(strikerPos);

        if (!simState.matchLit && distStriker < 0.95) {
          simState.matchLit = true;
          matchFlame.visible = true;
          matchLight.intensity = 1.6;
          emitSparks(matchGroup.position);
          updateTip('کبریت روشن شد؛ آن را به خروجی چراغ بونزن نزدیک کنید.');
        }

        if (simState.matchLit && !simState.burnerLit) {
          const burnerHead = new THREE.Vector3(0, 1.0, 0);
          if (activeDrag.position.distanceTo(burnerHead) < 1.0) {
            igniteBurner();
          }
        }
      }

      if (type === 'thermometer') {
        const dx = activeDrag.position.x;
        const dz = activeDrag.position.z;
        const rad = Math.sqrt(dx * dx + dz * dz);
        const tipY = activeDrag.position.y - 1.34;

        if (simState.beakerFilled && rad < 0.75 && tipY < 1.55 && tipY > 0.5) {
          simState.thermoActive = true;
          updateStatus('thermo-state', 'داخل آب بشر', '#38bdf8');
        } else {
          simState.thermoActive = false;
          updateStatus('thermo-state', 'خارج از آب', '#facc15');
        }
      }
    }

    function igniteBurner() {
      simState.burnerLit = true;
      burnerGroup.flame.visible = true;
      burnerLight.intensity = 2.8;
      simState.heatStartTime = performance.now();

      updateStatus('burner-state', 'شعله فعال', '#38bdf8');
      updateTip('دماسنج را داخل آب بشر قرار دهید تا تغییرات دما ثبت شود.');

      setTimeout(() => {
        matchFlame.visible = false;
        matchLight.intensity = 0;
        matchGroup.position.copy(POS_MATCH_DEF);
      }, 400);
    }

    function emitSparks(pos) {
      for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.02, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0xfacc15 })
        );
        p.position.copy(pos);
        p.userData = {
          velocity: new THREE.Vector3(
            (Math.random() - 0.5) * 0.08,
            Math.random() * 0.08,
            (Math.random() - 0.5) * 0.08
          )
        };
        scene.add(p);
        particles.sparks.push(p);
      }
    }

    function emitBubble() {
      if (!simState.beakerFilled || particles.bubbles.length > 20) return;
      const b = new THREE.Mesh(
        new THREE.SphereGeometry(0.025, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 })
      );
      b.position.set((Math.random() - 0.5) * 0.7, 0.65, (Math.random() - 0.5) * 0.7);
      scene.add(b);
      particles.bubbles.push(b);
    }

    function emitSteam() {
      if (!simState.beakerFilled || particles.steam.length > 20) return;
      const s = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 })
      );
      s.position.set((Math.random() - 0.5) * 0.4, 1.75, (Math.random() - 0.5) * 0.4);
      scene.add(s);
      particles.steam.push(s);
    }

    function updateSimulation(now) {
      if (simState.burnerLit && simState.heatStartTime) {
        const elapsed = (now - simState.heatStartTime) / 1000;
        const progress = Math.min(elapsed / simState.heatDuration, 1.0);

        simState.waterTemp = 25.0 + (100.0 - 25.0) * progress;
        $('heat-progress').style.width = (progress * 100).toFixed(1) + '%';
        $('temp-state').innerText = simState.waterTemp.toFixed(1) + ' °C';

        if (simState.waterTemp > 50 && Math.random() < 0.08) emitSteam();
        if (simState.waterTemp > 72 && Math.random() < 0.12) emitBubble();
        if (simState.waterTemp >= 100.0) {
          simState.waterTemp = 100.0;
          if (Math.random() < 0.25) emitSteam();
          if (Math.random() < 0.2) emitBubble();
        }
      }

      const targetTemp = simState.thermoActive ? simState.waterTemp : 25.0;
      simState.displayTemp += (targetTemp - simState.displayTemp) * 0.08;
      drawDisplay(simState.displayTemp);
    }

    function updateParticles() {
      for (let i = particles.sparks.length - 1; i >= 0; i--) {
        const p = particles.sparks[i];
        p.position.add(p.userData.velocity);
        p.userData.velocity.y -= 0.003;
        p.scale.multiplyScalar(0.92);
        if (p.scale.x < 0.05) {
          scene.remove(p);
          particles.sparks.splice(i, 1);
        }
      }

      for (let i = particles.bubbles.length - 1; i >= 0; i--) {
        const b = particles.bubbles[i];
        b.position.y += 0.016;
        if (b.position.y > 1.45) {
          scene.remove(b);
          particles.bubbles.splice(i, 1);
        }
      }

      for (let i = particles.steam.length - 1; i >= 0; i--) {
        const s = particles.steam[i];
        s.position.y += 0.018;
        s.scale.multiplyScalar(1.01);
        s.material.opacity -= 0.003;
        if (s.material.opacity <= 0.01) {
          scene.remove(s);
          particles.steam.splice(i, 1);
        }
      }
    }

    function renderLoop(timestamp, frame) {
      const now = performance.now();
      const t = now * 0.008;

      if (simState.burnerLit) {
        burnerFlameInner.scale.y = 1 + Math.sin(t * 3.5) * 0.12;
        burnerFlameOuter.scale.y = 1 + Math.cos(t * 2.8) * 0.15;
        burnerLight.intensity = 2.6 + Math.sin(t * 5.0) * 0.4;
      }

      if (matchFlame.visible) {
        matchFlame.scale.y = 1 + Math.sin(t * 5.0) * 0.15;
      }

      if (xrGrabbed) {
        processInteractions();
      }

      updateSimulation(now);
      updateParticles();

      if (!renderer.xr.isPresenting) {
        controls.update();
      }

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
